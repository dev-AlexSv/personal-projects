<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registration.css">
    <title>Enrollment</title>
    <style>
        @font-face {
            font-family: "OpenSans";
            src: url(fonts/Open_Sans/static/OpenSans-Bold.ttf);
        }

        @font-face {
            font-family: "OpenSansLight";
            src: url(fonts/Open_Sans/static/OpenSans-Light.ttf);
        }
    </style>
</head>
<body>
    <form action="https://httpbin.org/post" method="post">
        <div class="description-container">
            <h2>Enrollment Form</h2>
            <p>Please proceed to input on the following fields</p>
        </div>
       <fieldset>
             <div class="input-container">
                <label for="first-name">First Name: </label>
                <input id="first-name" name="first-name" type="text" placeholder="First Name..." required>
            </div>
            <div class="input-container">
                <label for="last-name">Last Name: </label>
                <input id="last-name" name="last-name" type="text" placeholder="Last Name..." required>
            </div>
            <div class="input-container">
                <label for="age">Age: </label>
                <input id="age" name="age" type="number" required>
            </div>
            <div class="input-container">
                <label for="user-email">Email: </label>
                <input type="email" id="user-email" name="user-email" placeholder="youremail@gmail.com" required>
            </div>
            <div class="input-container">
                <label for="dob">Date of Birth: </label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="input-container"    >
                <label for="choice-course">Choose your Course: </label>
                <select value="" name="course" id="choice-course" required>
                    <option value="Java">Java Programming NCIII</option>
                    <option value="Css">CSS NCII</option>
                </select>
            </div>
       </fieldset>
        <button id="bt-submit" type="submit">Submit</button>

    </form>
</body>
</html>
