<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registration.css">
    <title>Enrollment</title>
    <style>
        @font-face {
            font-family: "OpenSans";
            src: url(fonts/Open_Sans/static/OpenSans-Bold.ttf);
        }

        @font-face {
            font-family: "OpenSansLight";
            src: url(fonts/Open_Sans/static/OpenSans-Light.ttf);
        }
    </style>
</head>
<body>
    <div class="container-bg">

    </div>
    <div class="container-form">
        <form id="register-form" action="#" method="post">
            <h1>Become an Expert with Global Skills</h1>

            <fieldset>
                <div class="inputs-container">
                    <div class="label-input">
                        <label for="fname">Firstname</label>
                        <input id="fname" name="fname" type="text" placeholder="Firstname" required>
                    </div>

                    <div class="label-input">
                        <label for="lname">Lastname</label>
                        <input id="lname" name="lname" type="text" placeholder="Lastname" required>
                    </div>

                    <div class="label-input">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Email" required>
                    </div>

                    <div class="label-input">
                        <label for="contact-number">Contact Number</label>
                        <input id="contact-number" name="contact-number" type="number" placeholder="+63" required>
                    </div>

                    <div class="select-container">
                        <div class="label-input">
                            <label for="sex">Sex</label>
                            <select id="sex" name="sex">
                                <option value="" selected disabled>Courses</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>

                        <div class="label-input">
                            <label for="course-choice">Course</label>
                            <select id="course-choice" name="course-choice" required>
                                <option value="" selected disabled>Sex</option>
                                <option value="java">Java Programming</option>
                                <option value="css">Computer Systems Servicing</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit">Enroll</button>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
